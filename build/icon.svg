    <text x="512" y="892" text-anchor="middle" font-family="'Times New Roman', Georgia, 'Palatino', serif" font-size="190" font-weight="700" letter-spacing="6" fill="#ff8a5a" opacity="0.5" filter="url(#soft)">Λήθη</text>
  <text x="512" y="892" text-anchor="middle" font-family="'Times New Roman', Georgia, 'Palatino', serif" font-size="190" font-weight="700" letter-spacing="6" fill="url(#txt)">Λήθη</text>
