<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"><title>Privacy Report</title>
<link rel="stylesheet" href="common.css">
<style>
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
  .stat { background:var(--bar); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .stat b { display:block; font-size:30px; letter-spacing:-1px; } .stat span { color:var(--muted); font-size:13px; }
  .bars { display:flex; align-items:flex-end; gap:10px; height:150px; padding:10px 6px 0; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%; }
  .bar i { display:block; width:100%; min-height:3px; background:var(--accent); border-radius:6px 6px 2px 2px; }
  .bar small { color:var(--muted); font-size:11px; } .bar em { font-style:normal; font-size:11px; }
  table { width:100%; border-collapse:collapse; } td { padding:9px 4px; border-bottom:1px solid var(--border); } td:last-child { text-align:right; color:var(--muted); width:90px; }
  .meter { height:6px; background:var(--field); border-radius:3px; margin-top:6px; } .meter i { display:block; height:100%; background:var(--accent); border-radius:3px; }
</style></head>
<body><div class="page">
  <h1>Privacy Report</h1><div class="muted" id="sub">What Lethe kept off you over the last 7 days. Stored on this device only.</div>
  <div class="grid" id="grid"></div>
  <h2>Trackers blocked per day</h2><div class="card"><div class="bars" id="bars"></div></div>
  <h2>Most active trackers</h2><div class="card"><table id="top"></table></div>
  <div class="toolbar"><span class="muted" style="flex:1">The report counts trackers and protections only. It never stores the sites you visited or any page addresses.</span><a class="btn" href="lethe://settings">Settings</a><button class="btn danger" id="clear">Clear report</button></div>
</div>
<script src="common.js"></script><script src="report.js"></script></body></html>
