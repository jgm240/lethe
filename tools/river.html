<!doctype html>
<html><head><meta charset="utf-8"><title>lethe river</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const SCENE = +q.get('scene') || 1;
const W = +q.get('w') || 2560, H = +q.get('h') || 1440;
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = rng(seed), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = (h, x, y) => { switch (h & 7) { case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y; case 4: return x; case 5: return -x; case 6: return y; default: return -y; } };
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
    const u = f(x), v = f(y), a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(lerp(g(p[a], x, y), g(p[b], x - 1, y), u), lerp(g(p[a + 1], x, y - 1), g(p[b + 1], x - 1, y - 1), u), v);
  };
}
function fbm(n, x, y, oct) { let s = 0, a = 1, f = 1, t = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2; } return s / t; }
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------- sky ----------
function drawSky(g, o) {
  const y0 = o.horizon, lw = Math.round(W / 4), lh = Math.max(8, Math.round(y0 / 4));
  const c = mkCanvas(lw, lh), cg = c.getContext('2d'), img = cg.createImageData(lw, lh), d = img.data, n = makeNoise(o.seed || 3);
  const top = C(o.top), mid = C(o.mid), low = C(o.low), sunC = C(o.sun.col), cloudC = C(o.cloud.col);
  const sx = o.sun.x / W * lw, sy = o.sun.y / y0 * lh;
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
    const t = y / lh;
    let col = t < 0.55 ? mixc(top, mid, smooth(0, 0.55, t)) : mixc(mid, low, smooth(0.55, 1, t));
    const gx = (x - sx) / (lw * o.sun.spread), gy = (y - sy) / (lh * o.sun.spread * 0.9);
    const glow = Math.exp(-(gx * gx + gy * gy) * 2.2) * o.sun.strength;
    const cl = fbm(n, x * 0.012, y * 0.05, 5) * 0.5 + 0.5;
    const cm = smooth(0.46, 0.85, cl) * o.cloud.amount * (0.25 + 0.75 * smooth(0.1, 0.9, t));
    const lit = clamp(0.35 + glow * 1.3);
    col = mixc(col, mixc(cloudC, sunC, clamp(glow * 1.2)), cm * lit);
    const i = (y * lw + x) * 4;
    d[i] = clamp(col[0] + sunC[0] * glow * 0.75, 0, 255); d[i + 1] = clamp(col[1] + sunC[1] * glow * 0.75, 0, 255); d[i + 2] = clamp(col[2] + sunC[2] * glow * 0.75, 0, 255); d[i + 3] = 255;
  }
  cg.putImageData(img, 0, 0); g.save(); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, W, y0); g.restore();
  if (o.stars) { const r = rng(7); g.save(); for (let i = 0; i < 320; i++) { const x = r() * W, y = r() * y0 * 0.6, a = (1 - y / (y0 * 0.6)) * 0.85 * r(); g.fillStyle = `rgba(255,244,225,${a})`; g.fillRect(x, y, r() < 0.15 ? 2.4 : 1.4, r() < 0.15 ? 2.4 : 1.4); } g.restore(); }
}

// ---------- far bank, hills, ruins ----------
function drawBank(g, o) {
  const y0 = o.horizon;
  o.layers.forEach((L, li) => {
    const n = makeNoise(40 + li);
    const ridge = x => y0 - L.h - (fbm(n, x * L.freq + li * 7, li * 3.1, 4) * 0.5 + 0.5) * L.amp;
    const path = new Path2D(); path.moveTo(0, y0 + 3);
    for (let x = 0; x <= W; x += 4) path.lineTo(x, ridge(x));
    path.lineTo(W, y0 + 3); path.closePath();
    g.fillStyle = L.color; g.fill(path);
    if (o.temple && o.temple.layer === li) {
      const t = o.temple, by = ridge(t.x) + 8, cw = t.w, ch = t.h;
      g.fillStyle = L.color;
      g.fillRect(t.x - cw * 0.58, by - ch * 0.07, cw * 1.16, ch * 0.09);          // platform
      const cols = 7, colW = cw / (cols * 2 - 1);
      for (let i = 0; i < cols; i++) g.fillRect(t.x - cw / 2 + i * colW * 2, by - ch * 0.62, colW, ch * 0.56); // columns
      g.fillRect(t.x - cw * 0.55, by - ch * 0.74, cw * 1.1, ch * 0.13);            // entablature
      g.beginPath(); g.moveTo(t.x - cw * 0.58, by - ch * 0.74); g.lineTo(t.x, by - ch); g.lineTo(t.x + cw * 0.58, by - ch * 0.74); g.closePath(); g.fill(); // pediment
    }
    const gr = g.createLinearGradient(0, y0 - L.h - L.amp, 0, y0);
    gr.addColorStop(0, rgba(C(L.mistColor || '#e9784c'), 0)); gr.addColorStop(1, rgba(C(L.mistColor || '#e9784c'), L.mist));
    g.fillStyle = gr; g.fill(path);
  });
}

// ---------- water (real mirrored reflection of everything above the horizon) ----------
function drawWater(g, o) {
  const y0 = o.horizon, hgt = H - y0;
  const sky = g.getImageData(0, 0, W, y0).data;
  const img = g.createImageData(W, hgt), d = img.data;
  const n1 = makeNoise(21), n2 = makeNoise(22), n3 = makeNoise(23);
  const dF = C(o.deepFar), dN = C(o.deepNear), fogC = C(o.fog), sunC = C(o.sun.col);
  for (let y = 0; y < hgt; y++) {
    const dd = (y + 1) / hgt, z = 1 / (dd * 0.95 + 0.05);
    const deep = mixc(dF, dN, Math.pow(dd, 0.7));
    const fres = lerp(o.fresnel[0], o.fresnel[1], Math.pow(1 - dd, 1.2));
    const ampY = o.wave * (2 + dd * 30), ampX = o.wave * (1 + dd * 12);
    const fog = smooth(0.3, 0, dd) * o.fogAmount, gw = 40 + 460 * dd;
    for (let x = 0; x < W; x++) {
      const nx = (x - W / 2) * z * 0.0011 + (o.flow || 0), nz = z;
      const h1 = fbm(n1, nx * 0.9, nz * 0.9, 4), h2 = n2(nx * 3.2 + 9, nz * 3.0), h3 = n3(nx * 9, nz * 8);
      const slope = h1 * 0.9 + h2 * 0.55 + h3 * 0.25;
      let rx = Math.round(x + (h2 + h3 * 0.6) * ampX), ry = Math.round(2 * y0 - (y + y0) - 1 + slope * ampY);
      rx = rx < 0 ? 0 : rx >= W ? W - 1 : rx; ry = ry < 0 ? 0 : ry >= y0 ? y0 - 1 : ry;
      const si = (ry * W + rx) * 4, f = clamp(fres + slope * 0.06), sh = 1 + slope * 0.16 * (0.4 + dd);
      let r = lerp(deep[0], sky[si], f) * sh, gg = lerp(deep[1], sky[si + 1], f) * sh, b = lerp(deep[2], sky[si + 2], f) * sh;
      const gx = (x - o.sun.x) / gw, sp = Math.max(0, (h2 * 0.5 + h3 * 0.5 + h1 * 0.3) - 0.18);
      const gl = Math.exp(-gx * gx) * sp * sp * o.glint * (0.35 + dd * 1.4);
      r += sunC[0] * gl; gg += sunC[1] * gl; b += sunC[2] * gl;
      if (fog > 0) { const fv = fog * (0.7 + 0.3 * (n1(x * 0.004, y * 0.02) * 0.5 + 0.5)); r = lerp(r, fogC[0], fv); gg = lerp(gg, fogC[1], fv); b = lerp(b, fogC[2], fv); }
      const i = (y * W + x) * 4; d[i] = clamp(r, 0, 255); d[i + 1] = clamp(gg, 0, 255); d[i + 2] = clamp(b, 0, 255); d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, y0);
}

// ---------- papyrus ----------
const SITES = ['news-daily.example', 'shopfast.example/cart', 'videohub.example/watch', 'social-feed.example', 'mailbox.example/inbox', 'maps-live.example', 'forum-talk.example/t/4411', 'recipes-now.example', 'bank-portal.example/login', 'travel-deals.example', 'weather-now.example', 'music-stream.example'];
const GREEK = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞ';
function makePapyrus(seed, o = {}) {
  const w = o.w || 1000, h = o.h || 620, pad = 70, PW = w + 2 * pad, PH = h + 2 * pad, c = mkCanvas(PW, PH), g = c.getContext('2d');
  const n1 = makeNoise(seed), n2 = makeNoise(seed + 1), r = rng(seed + 2);
  const img = g.createImageData(PW, PH), d = img.data, c1 = [224, 196, 136], c2 = [180, 138, 80];
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const sx = x - pad, sy = y - pad, e = Math.min(sx, w - sx, sy, h - sy);
    const m = e + fbm(n1, sx * 0.012, sy * 0.012, 4) * 22 + n2(sx * 0.12, sy * 0.12) * 5 - 10;
    if (m < -2) continue;
    const blot = fbm(n2, sx * 0.006 + 3, sy * 0.006, 4) * 0.5 + 0.5;
    const sv = (hash(Math.floor(sx / 14) + seed) * 2 - 1) * 0.07, seam = (sx % 14) < 1.2 ? 0.9 : 1;
    const k = (1 + sv + n1(sx * 0.02, sy * 1.1) * 0.05 + n2(sx * 0.5, sy * 0.5) * 0.025 + (r() - 0.5) * 0.03) * seam;
    let col = mixc(c1, c2, blot * 0.85); col = mixc(col, [118, 76, 34], smooth(34, 0, m) * 0.55);
    const i = (y * PW + x) * 4; d[i] = clamp(col[0] * k, 0, 255); d[i + 1] = clamp(col[1] * k, 0, 255); d[i + 2] = clamp(col[2] * k, 0, 255); d[i + 3] = 255 * smooth(-2, 2, m);
  }
  g.putImageData(img, 0, 0);
  // ink
  if (o.text !== false) {
    const ink = mkCanvas(PW, PH), ig = ink.getContext('2d'), inset = o.roll === 'none' ? 60 : 118;
    ig.fillStyle = 'rgba(46,28,16,0.92)'; ig.textBaseline = 'alphabetic'; ig.textAlign = 'center';
    ig.font = '700 46px "Times New Roman", Georgia, serif'; ig.letterSpacing = '7px';
    ig.fillText('ΙΣΤΟΡΙΚΟ ΠΕΡΙΗΓΗΣΗΣ', pad + w / 2, pad + 100);
    ig.letterSpacing = '0px'; ig.fillRect(pad + inset, pad + 122, w - 2 * inset, 3); ig.fillRect(pad + inset, pad + 132, w - 2 * inset, 1.5);
    ig.textAlign = 'left'; ig.font = '30px Palatino, "Times New Roman", serif';
    const rows = Math.floor((h - 250) / 40);
    for (let i = 0; i < rows; i++) {
      const by = pad + 190 + i * 40 + (r() - 0.5) * 3; ig.save(); ig.translate(pad + inset, by); ig.rotate((r() - 0.5) * 0.008);
      ig.fillText(GREEK[i % GREEK.length] + '.  ' + SITES[(i * 5 + seed) % SITES.length], 0, 0);
      ig.fillRect(w - 2 * inset - 120 - r() * 60, -9, 90 + r() * 50, 2.2); ig.restore();
    }
    for (let i = 0; i < 6; i++) { const bx = pad + inset + r() * (w - 2 * inset), by = pad + 160 + r() * (h - 260); ig.fillStyle = 'rgba(46,28,16,0.35)'; ig.beginPath(); ig.arc(bx, by, 2 + r() * 5, 0, 7); ig.fill(); }
    g.save(); g.globalCompositeOperation = 'multiply'; g.filter = 'blur(0.7px)'; g.drawImage(ink, 0, 0); g.restore();
  }
  // roll ends
  const rr = 46, rolls = o.roll === 'none' ? [] : o.roll === 'left' ? [pad] : o.roll === 'right' ? [pad + w] : [pad, pad + w];
  for (const rx of rolls) {
    g.save();
    const sh = g.createLinearGradient(rx < pad + w / 2 ? rx : rx - 130, 0, rx < pad + w / 2 ? rx + 130 : rx, 0);
    sh.addColorStop(rx < pad + w / 2 ? 0 : 1, 'rgba(70,40,15,0.55)'); sh.addColorStop(rx < pad + w / 2 ? 1 : 0, 'rgba(70,40,15,0)');
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = sh; g.fillRect(pad - 20, pad - 20, w + 40, h + 40); g.restore();
    const cyl = g.createLinearGradient(rx - rr, 0, rx + rr, 0);
    [[0, '#5e3f1c'], [0.14, '#b98e52'], [0.42, '#efd9a6'], [0.7, '#c29a5c'], [1, '#553a1a']].forEach(([s, col]) => cyl.addColorStop(s, col));
    g.fillStyle = cyl; g.fillRect(rx - rr, pad - 8, rr * 2, h + 16);
    g.strokeStyle = 'rgba(60,36,14,0.5)'; g.lineWidth = 2; for (let k = 1; k < 6; k++) { g.beginPath(); g.moveTo(rx - rr + 4, pad - 8 + (h + 16) * k / 6 + (r() - 0.5) * 4); g.lineTo(rx + rr - 4, pad - 8 + (h + 16) * k / 6 + (r() - 0.5) * 4); g.stroke(); }
    for (const cy of [pad - 8, pad + h + 8]) {
      g.fillStyle = '#dcc088'; g.strokeStyle = '#6a4a22'; g.lineWidth = 3; g.beginPath(); g.ellipse(rx, cy, rr, rr * 0.3, 0, 0, 7); g.fill(); g.stroke();
      g.lineWidth = 1.6; for (let k = 1; k <= 3; k++) { g.beginPath(); g.ellipse(rx, cy, rr * (1 - k * 0.24), rr * 0.3 * (1 - k * 0.24), 0, 0, 7); g.stroke(); }
    }
  }
  return { canvas: c, PW, PH, pad, w, h };
}

// ---------- drawing helpers ----------
function mat(x, y, rot, sx, sy, skew, spr) {
  return new DOMMatrix().translate(x, y).rotate(rot).skewX(skew || 0).scale(sx, sy == null ? sx : sy).translate(-spr.PW / 2, -spr.PH / 2);
}
function drawSprite(g, spr, m, o = {}) { g.save(); g.setTransform(m); if (o.filter) g.filter = o.filter; g.globalAlpha = o.alpha == null ? 1 : o.alpha; g.drawImage(spr.canvas, 0, 0); g.restore(); }

function inkTrail(g, x, y, dx, dy, len, seed, w, dark = 0.2) {
  const r = rng(seed), n = makeNoise(seed + 5); g.save();
  for (let i = 0; i < 46; i++) {
    const t = i / 46, wob = n(i * 0.3, seed) * w * 1.4;
    const px = x + dx * t * len + wob * -dy, py = y + dy * t * len + wob * dx * 0.35, rad = w * (0.35 + t * 1.3) * (0.6 + r() * 0.7);
    g.filter = `blur(${5 + t * 12}px)`; g.fillStyle = `rgba(22,16,12,${dark * Math.pow(1 - t, 1.25) * (0.5 + r() * 0.7)})`;
    g.beginPath(); g.ellipse(px, py, rad * 1.6, rad * 0.7, 0, 0, 7); g.fill();
  }
  g.restore();
}

function ripples(g, x, y, s, n = 4, a = 0.35) {
  g.save(); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const rx = (40 + i * 46) * s, ry = rx * 0.24, al = a * (1 - i / n) * (1 - i * 0.1);
    g.strokeStyle = `rgba(235,245,255,${al})`; g.lineWidth = (3.2 - i * 0.55) * Math.max(0.6, s);
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, Math.PI * 0.06, Math.PI * 0.94); g.stroke();
    g.strokeStyle = `rgba(235,245,255,${al * 0.7})`; g.beginPath(); g.ellipse(x, y, rx, ry, 0, Math.PI * 1.06, Math.PI * 1.94); g.stroke();
  }
  g.restore();
}


// half-submerged look: darken/cool the lower part of a sprite
function submerge(spr, amount = 0.5, from = 0.55) {
  const c = mkCanvas(spr.PW, spr.PH), g = c.getContext('2d'); g.drawImage(spr.canvas, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  const gr = g.createLinearGradient(0, spr.PH * from, 0, spr.PH * 0.9); gr.addColorStop(0, 'rgba(20,40,60,0)'); gr.addColorStop(1, `rgba(14,34,54,${amount})`);
  g.fillStyle = gr; g.fillRect(0, 0, spr.PW, spr.PH);
  return Object.assign({}, spr, { canvas: c });
}
// mirrored reflection below a flat floating sprite (3 jittered copies = rippled look)
function drawReflection(g, spr, x, y, rot, sx, sy, skew, alpha) {
  const off = spr.PH * sy * 0.82;
  for (let k = -1; k <= 1; k++) drawSprite(g, spr, mat(x + k * 4, y + off, -rot, sx, -sy, -skew, spr), { filter: 'blur(2.5px) brightness(0.8)', alpha: alpha / 2 });
}

function splash(g, x, y, s, seed) {
  const r = rng(seed); g.save();
  ripples(g, x, y + 8 * s, s * 1.5, 6, 0.5);
  // foam patches
  for (let i = 0; i < 40; i++) { const a = r() * 6.283, d = r() * 80 * s; g.filter = 'blur(5px)'; g.fillStyle = `rgba(225,238,248,${0.10 + r() * 0.10})`; g.beginPath(); g.ellipse(x + Math.cos(a) * d * 1.6, y + Math.sin(a) * d * 0.3, (12 + r() * 22) * s, (5 + r() * 8) * s, 0, 0, 7); g.fill(); }
  // translucent water sheet / crown: tapered blobs fanning upward
  for (let i = 0; i < 26; i++) {
    const a = (i / 25 - 0.5) * 2.3 + (r() - 0.5) * 0.12, hgt = (60 + r() * 70) * s * (1 - Math.abs(a) * 0.35), bx = x + Math.sin(a) * 88 * s * 1.3;
    g.filter = 'blur(2.5px)'; const gr = g.createLinearGradient(0, y, 0, y - hgt); gr.addColorStop(0, 'rgba(235,245,252,0.42)'); gr.addColorStop(1, 'rgba(210,230,248,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(bx - 9 * s, y + 2 * s); g.quadraticCurveTo(bx - 4 * s + Math.sin(a) * 18 * s, y - hgt * 0.6, bx + Math.sin(a) * 38 * s, y - hgt); g.quadraticCurveTo(bx + 5 * s + Math.sin(a) * 18 * s, y - hgt * 0.55, bx + 9 * s, y + 2 * s); g.closePath(); g.fill();
  }
  g.filter = 'none';
  // droplets (blue-white, warm on the sun side)
  for (let i = 0; i < 70; i++) {
    const a = (r() - 0.5) * 2.5, v = 0.3 + r() * 0.7, px = x + Math.sin(a) * 125 * s * v * 1.25, py = y - (Math.cos(a) * 90 * s * v + r() * 70 * s), rad = (1.6 + r() * 3.2) * s;
    const warm = px < x ? 0.5 : 0, gr = g.createRadialGradient(px, py, 0, px, py, rad * 2.2);
    gr.addColorStop(0, `rgba(255,${246 - warm * 30},${238 - warm * 60},0.9)`); gr.addColorStop(0.5, 'rgba(205,228,248,0.45)'); gr.addColorStop(1, 'rgba(190,215,240,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(px, py, rad * 1.9, rad * (r() < 0.4 ? 3 : 2.2), a * 0.5, 0, 7); g.fill();
  }
  // soft central column
  for (let i = 0; i < 28; i++) { const t = i / 28; g.filter = 'blur(4px)'; g.fillStyle = `rgba(232,243,252,${0.2 * (1 - t)})`; g.beginPath(); g.ellipse(x + (r() - 0.5) * 20 * s, y - t * 120 * s, (14 - t * 8) * s, (9 - t * 4) * s, 0, 0, 7); g.fill(); }
  g.restore();
}

function reeds(g, o) {
  const r = rng(o.seed || 9); g.save(); g.lineCap = 'round';
  for (let i = 0; i < o.count; i++) {
    const x = o.x0 + r() * (o.x1 - o.x0), h = o.h * (0.35 + r() * 0.8), lean = (r() - 0.5) * 90 + o.lean;
    g.strokeStyle = o.color; g.lineWidth = 2 + r() * 5;
    g.beginPath(); g.moveTo(x, H + 10); g.quadraticCurveTo(x + lean * 0.3, H - h * 0.5, x + lean, H - h); g.stroke();
    if (r() < 0.22) { g.lineWidth = 11 + r() * 6; g.beginPath(); g.moveTo(x + lean * 0.96, H - h * 0.96); g.lineTo(x + lean, H - h - 36 - r() * 18); g.stroke(); }
  }
  g.restore();
}

function post(g, o) {
  const tmp = mkCanvas(W / 4, H / 4), tg = tmp.getContext('2d'); tg.filter = 'blur(8px) brightness(0.55) contrast(2.4)'; tg.drawImage(canvas, 0, 0, W / 4, H / 4);
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = o.bloom; g.imageSmoothingQuality = 'high'; g.drawImage(tmp, 0, 0, W, H);
  const t2 = mkCanvas(W / 10, H / 10), t2g = t2.getContext('2d'); t2g.filter = 'blur(6px) brightness(0.55) contrast(2.4)'; t2g.drawImage(canvas, 0, 0, W / 10, H / 10);
