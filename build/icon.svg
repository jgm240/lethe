    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4682"/><stop offset="0.45" stop-color="#2a2a6e"/><stop offset="1" stop-color="#0a1a40"/></linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dea8"/><stop offset="0.5" stop-color="#dcbc7c"/><stop offset="1" stop-color="#a47a40"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e2"/><stop offset="1" stop-color="#f3c892"/></linearGradient>
