<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0c2a}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script>
// "Eject to Lethe": papyrus scrolls are thrown into the river of forgetting (about 2.4 s).
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, t0 = 0, raf = 0;
const TOTAL = 2.4;
const rnd = (() => { let a = 1234567; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();
const N = 9, scrolls = [], drops = [];
function size() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', size); size();

function plan() {
  scrolls.length = 0; drops.length = 0;
  for (let i = 0; i < N; i++) {
    scrolls.push({ t0: 0.04 + i * 0.15, dur: 0.62 + rnd() * 0.12, sx: -0.08 * W + rnd() * 0.14 * W, sy: -0.12 * H - rnd() * 0.1 * H, ex: W * (0.28 + rnd() * 0.34), ey: H * (0.72 + rnd() * 0.12), arc: H * (0.18 + rnd() * 0.18), spin: (rnd() < 0.5 ? -1 : 1) * (2.2 + rnd() * 2), s: 0.7 + rnd() * 0.5, landed: false });
  }
}
function scroll(x, y, rot, s, alpha, squash) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s * squash); g.globalAlpha = alpha;
  g.fillStyle = '#e4c88e'; g.strokeStyle = '#7a5628'; g.lineWidth = 2.5; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-96, -17); g.lineTo(-58, -19); g.lineTo(-58, 19); g.lineTo(-95, 16); g.lineTo(-100, 7); g.lineTo(-96, 0); g.lineTo(-101, -8); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(74,47,24,.8)'; g.lineWidth = 2; for (const yy of [-8, 0, 8]) { g.beginPath(); g.moveTo(-88, yy); g.lineTo(-66, yy); g.stroke(); }
  const gr = g.createLinearGradient(0, -24, 0, 24); gr.addColorStop(0, '#f3dea8'); gr.addColorStop(0.5, '#dcbc7c'); gr.addColorStop(1, '#a47a40');
  g.fillStyle = gr; g.strokeStyle = '#7a5628'; g.lineWidth = 2.5;
  g.beginPath(); g.roundRect(-60, -24, 150, 48, 24); g.fill(); g.stroke();
  g.fillStyle = '#e9d3a0'; g.beginPath(); g.ellipse(90, 0, 14, 24, 0, 0, 7); g.fill(); g.stroke();
  g.lineWidth = 1.6; g.beginPath(); g.ellipse(90, 0, 8, 15, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(90, 0, 3.5, 7, 0, 0, 7); g.stroke();
  g.fillStyle = '#8a3d2b'; g.fillRect(32, -25, 10, 50);
  g.restore();
}
function scene(t) {
  const y0 = H * 0.6, sx = W * 0.32;
  const sky = g.createLinearGradient(0, 0, 0, y0); sky.addColorStop(0, '#131557'); sky.addColorStop(0.55, '#52387f'); sky.addColorStop(1, '#e98458');
  g.fillStyle = sky; g.fillRect(0, 0, W, y0);
  const glow = g.createRadialGradient(sx, y0, 0, sx, y0, W * 0.5); glow.addColorStop(0, 'rgba(255,214,150,.9)'); glow.addColorStop(0.3, 'rgba(255,160,100,.4)'); glow.addColorStop(1, 'rgba(255,140,90,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, y0);
  g.fillStyle = '#2a1f55'; g.beginPath(); g.moveTo(0, y0 + 2); for (let x = 0; x <= W; x += 8) g.lineTo(x, y0 - 26 - 22 * Math.sin(x * 0.004) - 14 * Math.sin(x * 0.011 + 1)); g.lineTo(W, y0 + 2); g.fill();
  const wat = g.createLinearGradient(0, y0, 0, H); wat.addColorStop(0, '#8c5688'); wat.addColorStop(0.35, '#2d2c70'); wat.addColorStop(1, '#0a1840'); g.fillStyle = wat; g.fillRect(0, y0, W, H - y0);
  for (let i = 0; i < 46; i++) { const k = i / 46, y = y0 + 6 + Math.pow(k, 1.5) * (H - y0), w = 30 + k * 260, x = sx + Math.sin(i * 12.9 + t * 1.4) * (14 + k * 140); g.fillStyle = `rgba(255,214,168,${0.32 * (1 - k * 0.7)})`; g.fillRect(x - w / 2, y, w, 2 + k * 3); }
}
function frame(now) {
  const t = (now - t0) / 1000;
  scene(t);
  for (const s of scrolls) {
    const p = (t - s.t0) / s.dur;
    if (p < 0) continue;
    if (p < 1) {
      const e = p, x = s.sx + (s.ex - s.sx) * e, y = s.sy + (s.ey - s.sy) * e - Math.sin(Math.PI * e) * s.arc;
      scroll(x, y, s.spin * p, s.s, 1, 1);
    } else {
      if (!s.landed) { s.landed = true; for (let k = 0; k < 14; k++) drops.push({ x: s.ex, y: s.ey, vx: (rnd() - 0.5) * 260, vy: -120 - rnd() * 220, t: t }); }
      const q = Math.min(1, (t - s.t0 - s.dur) / 0.7);
      scroll(s.ex, s.ey + q * 26, 0.12, s.s, 1 - q, 0.5 - q * 0.2);
      const a = 0.28 * (1 - q); g.fillStyle = `rgba(20,14,30,${a})`; g.beginPath(); g.ellipse(s.ex + q * 60, s.ey + 8, 40 + q * 90, 7 + q * 10, 0, 0, 7); g.fill();
      for (let r = 0; r < 3; r++) { const rq = (t - s.t0 - s.dur - r * 0.12) / 0.9; if (rq > 0 && rq < 1) { g.strokeStyle = `rgba(235,245,255,${0.5 * (1 - rq)})`; g.lineWidth = 2.4 - r * 0.5; g.beginPath(); g.ellipse(s.ex, s.ey + 12, (20 + rq * 150) * s.s, (5 + rq * 36) * s.s, 0, 0, 7); g.stroke(); } }
    }
  }
  for (const d of drops) { const dt = t - d.t; if (dt < 0 || dt > 0.9) continue; const x = d.x + d.vx * dt, y = d.y + d.vy * dt + 520 * dt * dt; g.fillStyle = `rgba(235,246,255,${0.8 * (1 - dt / 0.9)})`; g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill(); }
  // wordmark
  const ta = Math.max(0, Math.min(1, (t - 1.15) / 0.5));
  if (ta > 0) {
    const fs = Math.min(W, H) * 0.15; g.save(); g.globalAlpha = ta; g.textAlign = 'center'; g.font = `700 ${fs}px "Times New Roman", Georgia, serif`;
    g.shadowColor = 'rgba(255,138,90,.75)'; g.shadowBlur = 36; g.fillStyle = '#fff3dc'; g.fillText('Λήθη', W / 2, H * 0.4);
    g.shadowBlur = 0; g.font = `italic 400 ${fs * 0.2}px "Times New Roman", Georgia, serif`; g.fillStyle = 'rgba(255,236,210,.9)'; g.fillText('forgotten', W / 2, H * 0.4 + fs * 0.34); g.restore();
  }
  cv.style.opacity = t > TOTAL - 0.3 ? Math.max(0, (TOTAL - t) / 0.3) : 1;
  if (t < TOTAL + 0.2) raf = requestAnimationFrame(frame);
}
window.__start = () => { cancelAnimationFrame(raf); plan(); size(); cv.style.opacity = 1; t0 = performance.now(); raf = requestAnimationFrame(frame); };
</script></body></html>
