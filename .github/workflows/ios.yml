name: iOS

on:
  workflow_dispatch:
  push:
    branches: [ios-build]
    tags: ['ios-v*']

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Lethe.xcodeproj -scheme Lethe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
      - name: Check minimum OS and package IPA
        run: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/Lethe.app
          ls "$APP"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP/Info.plist" || true
          vtool -show-build "$APP/Lethe" | head -12
          lipo -info "$APP/Lethe"
          ls "$APP/Frameworks" 2>/dev/null | head -5 || true
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Lethe-0.4.0-ios-unsigned.ipa Payload
          ls -lh Lethe-0.4.0-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: lethe-ios-ipa
          path: ios/Lethe-0.4.0-ios-unsigned.ipa
          if-no-files-found: error
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: ios/Lethe-0.4.0-ios-unsigned.ipa
