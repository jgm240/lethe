<!doctype html>

<script>
const q = new URLSearchParams(location.search);
const SCENE = +q.get('scene') || 1;
const W = +q.get('w') || 2560, H = +q.get('h') || 1440;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { willReadFrequently: false });

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// ---------- paper ----------
const SITES = ['news-daily.example', 'shopfast.example/cart', 'videohub.example/watch', 'social-feed.example', 'mailbox.example/inbox', 'maps-live.example', 'forum-talk.example/t/4411', 'recipes-now.example', 'bank-portal.example/login', 'travel-deals.example', 'weather-now.example', 'music-stream.example', 'wiki-pages.example/Fire', 'jobs-board.example', 'cloud-docs.example/d/8f2'];
const CATS = ['News', 'Shopping', 'Video', 'Social', 'Email', 'Maps', 'Forum', 'Food', 'Finance', 'Travel', 'Weather', 'Music', 'Reference', 'Jobs', 'Docs'];

function makePaper(S, title, sub, stat, seed, stamp) {

  g.fillStyle = '#3a3a40'; g.font = '700 15px "Helvetica Neue", Helvetica, Arial, sans-serif';
  g.fillText('TIME', 86, 384); g.fillText('SITE', 200, 384); g.fillText('CATEGORY', 640, 384);
  g.font = '400 17px "Helvetica Neue", Helvetica, Arial, sans-serif';

    const y = 396 + i * 34, k = Math.floor(r() * SITES.length);
    if (i % 2) { g.fillStyle = 'rgba(120,105,80,.09)'; g.fillRect(70, y, 740, 34); }
    const hh = 8 + Math.floor(i * 0.6 + r() * 1.5), mm = Math.floor(r() * 60);
    g.fillStyle = '#4a4a50'; g.fillText(`${String(hh % 24).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, 86, y + 23);
    g.fillStyle = '#17171a'; g.fillText(SITES[k], 200, y + 23);
    g.fillStyle = '#6a6a70'; g.fillText(CATS[k], 640, y + 23);
  }
  g.fillStyle = '#8a8a90'; g.font = '400 15px "Helvetica Neue", Helvetica, Arial, sans-serif'; g.fillText('Page 1 of 48', 70, 1190); g.fillText('Confidential', 700, 1190);

  const img = g.getImageData(0, 0, c.width, c.height), d = img.data, n = makeNoise(seed + 7), rr = rng(seed + 9);
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const i = (y * c.width + x) * 4, u = x / S, v = y / S;

}

// ---------- burn ----------
function burnSheet(paper, ignites, seed) {

  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;

  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {

    if (s < CH) {
      const t = s / CH, glow = clamp(Math.pow(1 - t, 1.5) * (0.35 + 1.05 * h));
      const col = E(glow), m = clamp(glow * 1.15);
      const base = 10 + n3(u * 0.8, v * 0.8) * 5;
      d[i] = lerp(base + 4, col[0], m); d[i + 1] = lerp(base, col[1], m); d[i + 2] = lerp(base - 2, col[2], m);
      if (s < 1.3 && r() < 0.05 / (S * S) * 6) front.push({ x: u, y: v, g: glow });
    } else if (s < CH + SC) {
      const k0 = 1 - (s - CH) / SC, k = k0 * k0;
      const dark = clamp(k * 0.9 + (1 - h) * 0.08 * k);
      d[i] = lerp(pr, 52, dark); d[i + 1] = lerp(pg, 24, dark); d[i + 2] = lerp(pb, 7, dark);

    d[i + 3] = 255;

  g.putImageData(img, 0, 0);
  const soft = mkCanvas(c.width, c.height), sg = soft.getContext('2d');
  sg.filter = 'blur(' + (0.6 * S) + 'px)'; sg.drawImage(c, 0, 0);

}

// ---------- scene elements ----------
function matFor(cx, cy, rotDeg, scale, sheet) {
  return new DOMMatrix().translate(cx, cy).rotate(rotDeg).scale(scale).translate(-sheet.PW / 2, -sheet.PH / 2);
}
function drawSheet(g, sheet, m, filter, alpha) {
  g.save(); g.setTransform(m.scale(1 / sheet.S)); if (filter) g.filter = filter; g.globalAlpha = alpha == null ? 1 : alpha; g.drawImage(sheet.canvas, 0, 0); g.restore();
}
function frontPoints(sheet, m, max, r) {
  const pts = sheet.front.slice(); const out = [];
  while (out.length < max && pts.length) { const k = Math.floor(r() * pts.length); const [p] = pts.splice(k, 1); const t = m.transformPoint({ x: p.x, y: p.y }); out.push({ x: t.x, y: t.y, g: p.g }); }
  return out;
}
const FLAME = [[0, [255, 226, 160]], [0.2, [255, 168, 58]], [0.5, [236, 86, 24]], [1, [96, 18, 10]]];
function flameCol(t) { for (let i = 1; i < FLAME.length; i++) if (t <= FLAME[i][0]) { const a = FLAME[i - 1], b = FLAME[i], k = (t - a[0]) / (b[0] - a[0]); return a[1].map((v, j) => lerp(v, b[1][j], k)); } return FLAME[3][1]; }

  gr.addColorStop(0, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a})`); gr.addColorStop(0.45, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${a * 0.45})`); gr.addColorStop(1, `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
}
function drawFlames(g, pts, o) {
  const r = rng(o.seed), n = makeNoise(o.seed + 5), layer = mkCanvas(W, H), lg = layer.getContext('2d');
  lg.globalCompositeOperation = 'lighter';
  for (const p of pts) {
    const tall = r() < 0.2 ? 1.9 : 1;
    const hgt = o.height * tall * (0.35 + Math.pow(r(), 1.2) * 0.95) * (0.6 + p.g * 0.7), steps = 26, r0 = (5 + r() * 10) * o.size;
    let x = p.x, y = p.y; const ph = r() * 100, lean = (r() - 0.5) * 22 * o.size;
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      x += (n(ph + i * 0.22, p.y * 0.01) * 9 + (o.wind || 0) + lean / steps * 2) * o.size * (0.3 + t); y -= hgt / steps;
      const rad = r0 * (1 - t * 0.8) * (1 + 0.25 * Math.sin(i * 0.8 + ph));
      glowDot(lg, x, y, rad * 1.35, flameCol(Math.pow(t, 0.85)), Math.pow(1 - t, 1.25) * 0.14 * o.intensity);
    }
  }
  g.save(); g.globalCompositeOperation = 'lighter';
  g.filter = 'blur(' + Math.round(22 * o.size) + 'px)'; g.globalAlpha = 0.5; g.drawImage(layer, 0, 0);   // soft halo
  g.filter = 'blur(' + Math.round(4 * o.size) + 'px)'; g.globalAlpha = 0.8; g.drawImage(layer, 0, 0);                        // body
  g.filter = 'none'; g.globalAlpha = 0.5; g.drawImage(layer, 0, 0);                                    // crisp core
  g.restore();
}
function allFrontPoints(sheet, m) { return sheet.front.map(p => { const t = m.transformPoint({ x: p.x, y: p.y }); return { x: t.x, y: t.y, g: p.g }; }); }
const FIRE_RAMP = [[0, [0, 0, 0]], [0.16, [110, 18, 6]], [0.4, [226, 70, 14]], [0.65, [255, 150, 36]], [0.85, [255, 205, 90]], [1, [255, 240, 185]]];

// Procedural flame field: tall, wispy tongues rising from a burn edge (domain-warped, vertically-stretched noise).
function drawFlameField(g, pts, o) {
  if (!pts.length) return;
  const sc = o.scale || 1, n1 = makeNoise(o.seed), n2 = makeNoise(o.seed + 17), n3 = makeNoise(o.seed + 31);
  let x0 = 1e9, x1 = -1e9; for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; }
  x0 = Math.max(0, Math.floor(x0) - 24); x1 = Math.min(W - 1, Math.ceil(x1) + 24); const cols = x1 - x0 + 1; if (cols < 4) return;
  const fy = new Float32Array(cols).fill(Infinity);
  for (const p of pts) { const i = Math.round(p.x) - x0; if (i >= 0 && i < cols && p.y < fy[i]) fy[i] = p.y; }
  // fill gaps (nearest valid either side, linear), then smooth
  let last = -1;
  for (let i = 0; i < cols; i++) if (fy[i] !== Infinity) { if (last >= 0 && i - last > 1) for (let k = last + 1; k < i; k++) fy[k] = lerp(fy[last], fy[i], (k - last) / (i - last)); else if (last < 0) for (let k = 0; k < i; k++) fy[k] = fy[i]; last = i; }
  if (last < 0) return; for (let k = last + 1; k < cols; k++) fy[k] = fy[last];
  const sm = new Float32Array(cols); for (let i = 0; i < cols; i++) { let a = 0, c = 0; for (let k = -4; k <= 4; k++) { const j = i + k; if (j >= 0 && j < cols) { a += fy[j]; c++; } } sm[i] = a / c; }
  let ymin = 1e9, ymax = -1e9; for (let i = 0; i < cols; i++) { ymin = Math.min(ymin, sm[i]); ymax = Math.max(ymax, sm[i]); }
  const top = Math.max(0, Math.floor(ymin - o.height * 1.9)), bot = Math.min(H, Math.ceil(ymax + 6)), rows = bot - top; if (rows < 4) return;
  const c = mkCanvas(cols, rows), cg = c.getContext('2d'), img = cg.createImageData(cols, rows), d = img.data;
  for (let xi = 0; xi < cols; xi++) {
    const x = x0 + xi, base = sm[xi];
    const hx = o.height * (0.45 + Math.pow(n3(x * 0.0045 / sc + 3.1, 7.7) * 0.5 + 0.5, 1.4) * 1.25) * (0.8 + 0.4 * (n3(x * 0.02 / sc, 1.3) * 0.5 + 0.5));
    for (let yi = 0; yi < rows; yi++) {
      const y = top + yi, dy = base - y; if (dy < -3) continue;
      const t = dy / hx; if (t > 1.15) continue;
      const wx = fbm(n2, x * 0.006 / sc, y * 0.004 / sc, 3) * o.warp * (0.25 + t) * hx * 0.32;
      const dn = fbm(n1, (x + wx) * 0.017 / sc, y * 0.0062 / sc + (o.phase || 0), 4) * 0.5 + 0.5;

      if (val <= 0) continue;

      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255 * smooth(0, 0.1, val) * (t < 0 ? 1 + t / 3 : 1) * smooth(0, 38 * sc, Math.min(x0 > 0 ? xi : 1e9, x1 < W - 1 ? cols - 1 - xi : 1e9));
    }
  }
  cg.putImageData(img, 0, 0);
  g.save();
  g.globalCompositeOperation = 'lighter'; g.filter = 'blur(' + Math.round(34 * sc) + 'px)'; g.globalAlpha = 0.5; g.drawImage(c, x0, top);
  g.filter = 'blur(' + Math.round(9 * sc) + 'px)'; g.globalAlpha = 0.45; g.drawImage(c, x0, top);
  g.globalCompositeOperation = 'source-over'; g.filter = 'blur(' + (1.4 + (o.blur || 0)) + 'px)'; g.globalAlpha = 1; g.drawImage(c, x0, top);
  g.restore();
}
function drawFlakes(g, count, o) {
  const r = rng(o.seed);
  for (let i = 0; i < count; i++) {
    const x = lerp(o.x0, o.x1, r()), y = lerp(o.y0, o.y1, Math.pow(r(), 0.8)), rad = (4 + r() * 11) * o.size, nv = 5 + Math.floor(r() * 3), rot = r() * 6.3;
    const near = r() < 0.5; g.save(); g.translate(x, y); g.rotate(rot); g.filter = 'blur(' + (near ? 1.4 : 3 + r() * 5) + 'px)';
    g.beginPath(); for (let k = 0; k < nv; k++) { const a = k / nv * 6.283, rr = rad * (0.55 + r() * 0.6); g.lineTo(Math.cos(a) * rr * 1.3, Math.sin(a) * rr * 0.8); } g.closePath();
    g.fillStyle = `rgba(${14 + r() * 14},${10 + r() * 8},${9 + r() * 6},${0.85})`; g.fill();
    if (r() < 0.35) { g.strokeStyle = `rgba(255,${100 + r() * 60},30,0.35)`; g.lineWidth = 1.2 * o.size; g.stroke(); }
    g.restore();
  }
}
function drawSmoke(g, x0, x1, y0, count, o) {
  const r = rng(o.seed); g.save();
  for (let i = 0; i < count; i++) {
    const x = lerp(x0, x1, r()), t = r(), y = y0 - t * o.rise, rad = (60 + r() * 140) * (0.6 + t * 1.2);
    g.filter = `blur(${28 + t * 30}px)`; const gray = 34 + r() * 26; const a = Math.sin(t * 3.14) * 0.09 * o.density;
    g.fillStyle = `rgba(${gray + 12},${gray + 6},${gray + 8},${a})`; g.beginPath(); g.ellipse(x + Math.sin(t * 5 + i) * 60, y, rad, rad * 0.8, 0, 0, 7); g.fill();

function drawEmbers(g, region, count, o) {
  const r = rng(o.seed); g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < count; i++) {
    const x = lerp(region.x0, region.x1, r()), t = Math.pow(r(), 1.4), y = region.y0 - t * region.rise;
    const sz = (0.9 + r() * 3.2) * (1 - t * 0.5) * o.size, col = r() < 0.5 ? [255, 190, 90] : [255, 120, 40], a = (0.35 + r() * 0.65) * (1 - t * 0.7);

function drawBokeh(g, count, o) {

  for (let i = 0; i < count; i++) {
    const x = r() * W, y = o.y0 + r() * (o.y1 - o.y0), rad = 25 + r() * 80;
    g.filter = 'blur(' + (8 + r() * 12) + 'px)'; const col = r() < 0.7 ? [255, 130, 50] : [255, 190, 100];
    g.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.03 + r() * 0.07 * o.strength})`; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
  }

}
function drawBackground(g, o) {

  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {

    const top = o.top, bot = o.bot, k = Math.pow(v, 0.9);

function post(g, o) {

  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = o.bloom; g.imageSmoothingQuality = 'high'; g.drawImage(tmp, 0, 0, W, H);
  const tmp2 = mkCanvas(W / 10, H / 10), t2 = tmp2.getContext('2d'); t2.filter = 'blur(6px) brightness(0.55) contrast(2.4)'; t2.drawImage(canvas, 0, 0, W / 10, H / 10);
