<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src https: data:">
<title>Reader</title>
<link rel="stylesheet" href="common.css">
<style>
  body { --fs: 20px; --paper:#e8d7ab; --ink:#3a2814; --ink2:#7a6240; --line:rgba(90,62,24,.25); --link:#8a3d2b; background:var(--paper); color:var(--ink); transition:background .2s; }
  body.light { --paper:#fbfbf8; --ink:#1b1b1f; --ink2:#6c6c72; --line:rgba(0,0,0,.12); --link:#b4491f; }
  body.dark { --paper:#15161c; --ink:#e6e2d8; --ink2:#9a97a8; --line:rgba(255,255,255,.14); --link:#ff9a6c; }
  body.papyrus { background:radial-gradient(ellipse at 20% 0%, rgba(255,246,214,.55), transparent 60%), radial-gradient(ellipse at 90% 100%, rgba(170,120,60,.28), transparent 55%), var(--paper); }
  #bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 18px; background:color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  #bar .sp { flex:1; }
  #bar button, #bar select { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:6px 10px; font:inherit; cursor:default; }
  #bar button:hover { background:color-mix(in srgb, var(--ink) 10%, transparent); } #bar button.on { background:var(--ink); color:var(--paper); }
  main { max-width:720px; margin:0 auto; padding:34px 22px 120px; }
  main.serif { font-family:Georgia,"Times New Roman",Palatino,serif; } main.sans { font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  h1 { font-size:2.05em; line-height:1.18; margin:0 0 10px; letter-spacing:-.5px; }
  .meta { color:var(--ink2); font-size:.8em; margin-bottom:26px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  article { font-size:var(--fs); line-height:1.7; }
  article p { margin:0 0 1.1em; } article h1,article h2,article h3,article h4 { line-height:1.25; margin:1.6em 0 .5em; }
  article a { color:var(--link); } article img { max-width:100%; height:auto; border-radius:6px; display:block; margin:1em auto; }
  article blockquote { margin:1.2em 0; padding:.2em 1.1em; border-left:3px solid var(--line); color:var(--ink2); }
  article pre, article code { background:color-mix(in srgb, var(--ink) 8%, transparent); border-radius:6px; font:.85em ui-monospace,Menlo,monospace; } article pre { padding:12px; overflow:auto; } article code { padding:1px 5px; }
  article table { border-collapse:collapse; width:100%; } article td, article th { border:1px solid var(--line); padding:6px 9px; }
  article figure { margin:1em 0; } article figcaption { color:var(--ink2); font-size:.8em; text-align:center; }
  .speaking { background:color-mix(in srgb, var(--link) 18%, transparent); border-radius:4px; }
  body.noimg article img, body.noimg article figure { display:none; }
  .err { text-align:center; padding:90px 0; color:var(--ink2); }
</style></head>
<body class="papyrus">
<div id="bar">
  <button id="orig">← Original page</button>
  <span class="sp"></span>
  <button id="play">▶ Listen</button><button id="stop" hidden>■</button>
  <select id="rate" title="Reading speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.8">1.8×</option></select>
  <button id="smaller">A−</button><button id="bigger">A+</button>
  <select id="font"><option value="serif">Serif</option><option value="sans">Sans</option></select>
  <select id="theme"><option value="papyrus">Papyrus</option><option value="light">Light</option><option value="dark">Dark</option></select>
</div>
<main id="main" class="serif"><h1 id="title"></h1><div class="meta" id="meta"></div><article id="art"></article></main>
<script src="common.js"></script><script src="reader.js"></script></body></html>
